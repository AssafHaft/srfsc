<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ניתוח – SRF Park TLV (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Mockup of the analysis tab. Real park data: last 90 days (13.6–10.9.2026) against the same weeks of 2025,
   upcoming sessions as published on 11.9.2026 20:38. Static except the heatmap metric switch. */
:root {
  --foam: #F1F6F5; --deck: #FFFFFF; --deep: #0F2B35; --deep-2: #244652; --deep-3: #17394A;
  --mist: #5F7A83; --mist-2: #9DB4BA; --line: #D8E3E2; --rescue: #FF5A1F; --rescue-ink: #B23A0C;
  --sand-tint: #FBF5E6; --sand-line: #EBD9A8;
  --l0: #E2B860; --l1: #91C36B; --l2: #6F9B5C; --l3: #487037; --l4: #81ABCA; --l5: #225A8C; --l6: #8A71B2;
  --h0: #EEF3F2; --h1: #D3E3E3; --h2: #A8C6CA; --h3: #6F9AA4; --h4: #3B6B79; --h5: #0F2B35;
  --display: "Secular One", "IBM Plex Sans Hebrew", system-ui, sans-serif;
  --text: "IBM Plex Sans Hebrew", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--foam); }
body { margin: 0; font-family: var(--text); color: var(--deep); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--deep); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 32px 24px 56px; }

/* header (as on the schedule) */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 18px; }
.brand h1 { font-family: var(--display); font-weight: 400; font-size: 36px; line-height: 1; margin: 0; }
.brand p { margin: 8px 0 0; color: var(--mist); font-size: 14px; }
.fresh { display: flex; align-items: center; gap: 14px; }
.fresh-text { text-align: end; font-size: 13px; color: var(--mist); line-height: 1.45; }
.fresh-text strong { display: block; color: var(--deep); font-weight: 500; font-size: 14px; }
.btn-refresh { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border: 1.5px solid var(--deep); border-radius: 999px; font-weight: 500; font-size: 14px; }
.btn-refresh svg { width: 16px; height: 16px; }

/* NEW: top-level tabs */
.tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tabs button { position: relative; padding: 6px 2px 10px; font-family: var(--display); font-size: 20px; color: var(--mist); }
.tabs button[aria-selected="true"] { color: var(--deep); }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; inset-inline: 0; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--deep); }

/* controls (as on the schedule) */
.controls { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; margin-bottom: 8px; }
.seg { display: inline-flex; background: var(--deck); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { padding: 6px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--mist); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--deep); color: var(--foam); }
.seg.sm button { padding: 3px 12px; font-size: 13px; }
.levels { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.levels-label { font-size: 13px; color: var(--mist); margin-inline-end: 6px; }
.lv-toggle { padding: 3px; border-radius: 8px; border: 1.5px solid transparent; }
.chip { display: inline-grid; place-items: center; min-width: 30px; height: 20px; padding: 0 5px; border-radius: 5px; font-size: 12px; font-weight: 600; line-height: 1; color: #fff; direction: ltr; flex: none; }
.chip.lv0, .chip.lv1, .chip.lv2, .chip.lv4 { color: var(--deep); }
.lv0 { background: var(--l0); } .lv1 { background: var(--l1); } .lv2 { background: var(--l2); } .lv3 { background: var(--l3); }
.lv4 { background: var(--l4); } .lv5 { background: var(--l5); } .lv6 { background: var(--l6); }
.compare-note { margin: 0 0 22px; font-size: 13px; color: var(--mist); }
.compare-note b { color: var(--deep); font-weight: 500; }

/* sections */
.sec { margin-top: 34px; scroll-margin-top: 16px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 12px; }
.sec h2 { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.15; margin: 0; }
.sec-sub { margin: 2px 0 0; font-size: 13px; color: var(--mist); }
.card { background: var(--deck); border: 1px solid var(--line); border-radius: 14px; }
.foot { margin: 10px 2px 0; font-size: 12px; color: var(--mist); }

/* 1. KPIs */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.kpi { padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 2px; }
.kpi .k { font-size: 13px; color: var(--mist); }
.kpi .v { font-family: var(--display); font-size: 32px; line-height: 1.1; }
.kpi .d { font-size: 12.5px; line-height: 1.4; }
.kpi .d .ar { font-weight: 600; }
.kpi .d.bad .ar { color: var(--rescue-ink); }
.kpi .d .ly { color: var(--mist); }
.kpi.lead { background: var(--deep); border-color: var(--deep); color: var(--foam); }
.kpi.lead .k, .kpi.lead .d .ly { color: var(--mist-2); }
.kpi.lead .d.bad .ar { color: #FF9A70; }

/* 2. insights */
.ins { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ins li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 4px 12px; padding: 14px 16px; border-inline-start: 4px solid var(--line); }
.ins li.bad { border-inline-start-color: var(--rescue); }
.ins li.good { border-inline-start-color: var(--deep); }
.ins .n { font-family: var(--display); font-size: 22px; line-height: 1.1; color: var(--mist-2); }
.ins .t { font-size: 15px; font-weight: 500; line-height: 1.45; }
.ins .m { grid-column: 2; display: flex; gap: 14px; font-size: 12.5px; color: var(--mist); }
.ins .m a { font-weight: 500; color: var(--deep); text-underline-offset: 3px; }

/* 3. heatmap */
.heat-wrap { padding: 14px 14px 12px; overflow-x: auto; }
.heat { display: grid; grid-template-columns: 44px repeat(7, minmax(44px, 1fr)); gap: 3px; min-width: 360px; }
.heat .hd { font-size: 12.5px; color: var(--mist); text-align: center; padding-bottom: 2px; }
.heat .hd b { display: block; font-weight: 500; color: var(--deep); }
.heat .hr { font-size: 12px; color: var(--mist); display: flex; align-items: center; }
.heat .c { height: 30px; border-radius: 5px; display: grid; place-items: center; font-size: 12px; font-weight: 500; background: var(--h0); }
.heat .c.x { background: transparent; border: 1px dashed var(--line); }
.heat .c.s1 { background: var(--h1); } .heat .c.s2 { background: var(--h2); }
.heat .c.s3 { background: var(--h3); color: #fff; } .heat .c.s4 { background: var(--h4); color: #fff; } .heat .c.s5 { background: var(--h5); color: #fff; }
.scale { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 12px; color: var(--mist); flex-wrap: wrap; }
.scale i { width: 26px; height: 12px; border-radius: 3px; display: inline-block; }

/* 4. levels table */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { font-weight: 400; font-size: 12.5px; color: var(--mist); text-align: start; padding: 10px 12px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
.tbl tr:first-child td { border-top: 0; }
.tbl .lvcell { display: flex; align-items: center; gap: 8px; }
.tbl .lvcell small { color: var(--mist); font-size: 12.5px; }
.occ { display: flex; align-items: center; gap: 8px; min-width: 150px; }
.occ .bar { flex: 1; height: 8px; border-radius: 4px; background: #E4ECEB; overflow: hidden; position: relative; }
.occ .bar i { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--deep); border-radius: 4px; }
.occ .bar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--rescue); }
.occ span { min-width: 34px; font-weight: 600; }
.dlt { font-size: 12.5px; }
.dlt.bad { color: var(--rescue-ink); font-weight: 600; }
.sd { display: grid; gap: 3px; min-width: 120px; }
.sd div { height: 6px; border-radius: 3px; }
.sd .cap { background: var(--mist-2); }
.sd .bk { background: var(--deep); }
.tbl-scroll { overflow-x: auto; }

/* 5. slots */
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.slots h3 { margin: 0; padding: 12px 16px 8px; font-size: 15px; font-weight: 600; border-bottom: 1px solid var(--line); }
.slots h3 small { font-weight: 400; color: var(--mist); font-size: 12.5px; margin-inline-start: 6px; }
.slot { display: grid; grid-template-columns: 22px 104px 76px minmax(0, 1fr) 64px; gap: 8px; align-items: center; padding: 7px 16px; border-top: 1px solid var(--line); font-size: 14px; }
.slot:first-of-type { border-top: 0; }
.slot .rk { color: var(--mist-2); font-size: 12.5px; }
.slot .wh { font-weight: 500; }
.slot .v { text-align: end; font-size: 12.5px; color: var(--mist); }
.slot .occ { min-width: 0; }

/* 6. trend */
.trend { padding: 14px 14px 8px; }
.trend svg { width: 100%; height: auto; display: block; }
.trend .lg { display: flex; gap: 18px; font-size: 12.5px; color: var(--mist); margin: 4px 4px 0; flex-wrap: wrap; }
.trend .lg span { display: inline-flex; align-items: center; gap: 6px; }

/* 7. pace */
.pace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 8px; }
.collect { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.collect .big { font-family: var(--display); font-size: 28px; line-height: 1.1; }
.meter { height: 8px; border-radius: 4px; background: #E4ECEB; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--deep); }
.collect ul { margin: 0; padding-inline-start: 18px; font-size: 13.5px; color: var(--mist); }
.example { padding: 14px; position: relative; }
.example .tag { position: absolute; top: 12px; inset-inline-start: 14px; font-size: 12px; font-weight: 600; color: var(--mist); border: 1px dashed var(--mist-2); border-radius: 4px; padding: 0 6px; }
.example svg { width: 100%; height: auto; display: block; opacity: .75; }

/* 8. upcoming */
.up { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 8px; }
.days { padding: 14px 14px 10px; }
.days .bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; }
.days .b { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; height: 100%; }
.days .b i { width: 100%; border-radius: 4px 4px 0 0; background: var(--deep); min-height: 2px; }
.days .b em { font-style: normal; font-size: 11.5px; font-weight: 600; }
.days .lbl { display: flex; gap: 6px; margin-top: 4px; }
.days .lbl span { flex: 1; text-align: center; font-size: 11px; color: var(--mist); line-height: 1.25; }
.days .lbl span b { display: block; color: var(--deep); font-weight: 500; }
.risk h3 { margin: 0; padding: 12px 16px 8px; font-size: 15px; font-weight: 600; border-bottom: 1px solid var(--line); }
.risk h3 small { font-weight: 400; color: var(--mist); font-size: 12.5px; margin-inline-start: 6px; }
.rrow { display: grid; grid-template-columns: 92px 44px minmax(0, 1fr) 88px; gap: 10px; align-items: center; padding: 7px 16px; border-top: 1px solid var(--line); font-size: 14px; }
.rrow:first-of-type { border-top: 0; }
.rrow .when b { display: block; font-weight: 600; }
.rrow .when span { font-size: 12px; color: var(--mist); }
.rrow .nm { font-size: 13px; color: var(--mist); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rrow .fill { text-align: end; font-weight: 600; }
.rrow .fill small { display: block; font-weight: 400; font-size: 12px; color: var(--mist); }
.more { padding: 8px 16px 12px; font-size: 13px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }

/* 9. operations */
.ops { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.op { padding: 14px; }
.op .v { display: block; font-family: var(--display); font-size: 26px; line-height: 1.1; }
.op .k { display: block; font-size: 13px; font-weight: 500; }
/* charts are laid out in code (time order included), so SVG text must not inherit RTL anchoring */
svg text { direction: ltr; unicode-bidi: plaintext; }
.op p { margin: 4px 0 0; font-size: 12.5px; color: var(--mist); line-height: 1.45; }
.coverage { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--mist); }

@media (max-width: 720px) {
  .wrap { padding: 20px 14px 44px; }
  .brand h1 { font-size: 30px; }
  .fresh { width: 100%; justify-content: space-between; }
  .fresh-text { text-align: start; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi .v { font-size: 28px; }
  .ins, .slots, .pace, .up { grid-template-columns: 1fr; }
  .ops { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .heat { grid-template-columns: 34px repeat(7, minmax(0, 1fr)); gap: 2px; min-width: 0; }
  .heat .c { font-size: 10.5px; height: 26px; }
  .slot { grid-template-columns: 18px 88px 70px minmax(0, 1fr) 56px; gap: 6px; padding: 7px 12px; }
  .rrow { grid-template-columns: 78px 40px minmax(0, 1fr) 70px; gap: 8px; padding: 7px 12px; }
  .days .lbl span { font-size: 10px; }
  .days .b em { font-size: 10px; }
}
</style>
</head>

const HE_DAYS = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
const SHORT = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
const pct = x => (x === null || x === undefined ? '–' : `${Math.round(x * 100)}%`);
const pts = (a, b) => Math.round(a * 100) - Math.round(b * 100);
const int = n => Math.round(n).toLocaleString('en-US');
const money = n => `<span class="ltr num">${n >= 1e6 ? `₪${(n / 1e6).toFixed(1)}M` : n >= 1e4 ? `₪${Math.round(n / 1e3)}K` : `₪${int(n)}`}</span>`;
const d2 = iso => { const [, m, d] = iso.split('-'); return `${+d}.${+m}`; };
const dow = iso => new Date(`${iso}T12:00:00Z`).getUTCDay();
const lvChip = key => key.startsWith('bay') ? '<span class="chip lv0">Bay</span>' : `<span class="chip lv${key.slice(1)}">${key}</span>`;
const lvName = key => key === 'bay-adult' ? 'מבוגרים' : key === 'bay-kids' ? 'ילדים' : '';
const $ = s => document.querySelector(s);

// level chips + compare note
$('#levels').innerHTML = '<span class="levels-label">רמות:</span>' + [0, 1, 2, 3, 4, 5, 6].map(l => `<button class="lv-toggle"><span class="chip lv${l}">${l ? `L${l}` : 'Bay'}</span></button>`).join('');
const P = DATA.period;
$('#compare-note').innerHTML = `מציג <b>${d2(P.from)}–${d2(P.to)}.${P.to.slice(0, 4)}</b> (עד אתמול) בהשוואה ל־<b>אותם שבועות אשתקד</b>, ${d2(P.lyFrom)}–${d2(P.lyTo)}.${P.lyTo.slice(0, 4)}`;

function delta(cur, ly, { unit = '%', lowerIsBetter = false, fmt } = {}) {
  if (ly === null || ly === undefined) return '<div class="d"><span class="ly">אין נתונים מאשתקד</span></div>';
  let diff, txt;
  if (unit === 'pts') { diff = pts(cur, ly); txt = `${Math.abs(diff)} נק׳`; }
  else { diff = Math.round((cur / ly - 1) * 100); txt = `${Math.abs(diff)}%`; }
  const bad = lowerIsBetter ? diff > 0 : diff < 0;
  const ar = diff === 0 ? '=' : diff > 0 ? '▲' : '▼';
  return `<div class="d ${bad && diff !== 0 ? 'bad' : ''}"><span class="ar">${ar} ${txt}</span> <span class="ly">· אשתקד ${fmt(ly)}</span></div>`;
}

function kpis() {
  const { cur, ly, open, closed } = DATA.kpis;
  return `<section class="sec" id="kpis"><div class="kpis">
    <div class="card kpi lead"><span class="k">תפוסה</span><span class="v num">${pct(cur.occupancy)}</span>${delta(cur.occupancy, ly.occupancy, { unit: 'pts', fmt: pct })}</div>
    <div class="card kpi"><span class="k">מקומות שנמכרו</span><span class="v num">${int(cur.booked)}</span>${delta(cur.booked, ly.booked, { fmt: int })}</div>
    <div class="card kpi"><span class="k">הכנסה משוערת</span><span class="v">${money(cur.revenue)}</span>${delta(cur.revenue, ly.revenue, { fmt: n => money(n) })}</div>
    <div class="card kpi"><span class="k">סשנים שנמכרו עד הסוף</span><span class="v num">${pct(cur.soldOut)}</span>${delta(cur.soldOut, ly.soldOut, { unit: 'pts', fmt: pct })}</div>
    <div class="card kpi"><span class="k">שווי מקומות ריקים</span><span class="v">${money(cur.emptyValue)}</span>${delta(cur.emptyValue, ly.emptyValue, { lowerIsBetter: true, fmt: n => money(n) })}</div>
    <div class="card kpi"><span class="k">ימי פעילות</span><span class="v num">${open}</span><div class="d"><span class="ly">${closed ? `${closed} ימים סגורים` : 'בלי ימים סגורים'} · ${int(cur.capacity)} מקומות</span></div></div>
  </div><p class="foot">הכנסה ושווי מקומות ריקים הם הערכה לפי מחירון (ריף L1–L4 ‏360 ₪, L5–L6 ‏390 ₪, Bay מבוגרים 250 ₪, Bay ילדים 195 ₪), בלי כרטיסיות, מנויים והנחות. התפוסה והמקומות לא כוללים אירועים פרטיים וסשנים שבוטלו.</p></section>`;
}

const LINKS = { trend: 'למגמה', levels: 'לטבלת הרמות', heat: 'למפת העומס', slots: 'לסשנים החלשים', upcoming: 'לימים הקרובים', pace: 'לקצב ההזמנות' };
function insights() {
  return `<section class="sec" id="insights"><div class="sec-head"><div><h2>מה בולט</h2><p class="sec-sub">מסקנות אוטומטיות מהתקופה שנבחרה, מהחשובה ביותר. כל אחת מבוססת על לפחות 20 סשנים.</p></div></div>
    <ol class="ins">${DATA.insights.map((i, n) => `<li class="card ${i.tone}"><span class="n num">${n + 1}</span><span class="t">${i.text}</span><span class="m"><span>השפעה: ${money(i.impact)}</span><a href="#${i.link}">${LINKS[i.link]} ←</a></span></li>`).join('')}</ol></section>`;
}

const STEPS = { occupancy: [0.4, 0.55, 0.7, 0.85, 0.95], soldOut: [0.1, 0.25, 0.4, 0.6, 0.8] };
function heatCells(metric) {
  const max = Math.max(...DATA.heat.flatMap(r => r.cells.filter(Boolean).map(c => c.revenue)));
  const step = c => { const v = metric === 'revenue' ? c.revenue / max : c[metric]; const s = metric === 'revenue' ? [0.2, 0.4, 0.6, 0.8, 0.95] : STEPS[metric]; return s.filter(t => v >= t).length; };
  const label = c => metric === 'revenue' ? `${Math.round(c.revenue / 1e3)}K` : pct(c[metric]);
  return DATA.heat.map(r => `<div class="hr num">${r.hour}:00</div>` + r.cells.map((c, d) => c ? `<div class="c s${step(c)} num" title="${HE_DAYS[d]} ${r.hour}:00 · ${c.n} סשנים · תפוסה ${pct(c.occupancy)} · נמכרו עד הסוף ${pct(c.soldOut)}">${label(c)}</div>` : '<div class="c x" title="פחות מ־4 סשנים"></div>').join('')).join('');
}
function heat() {
  return `<section class="sec" id="heat"><div class="sec-head"><div><h2>מתי עמוס</h2><p class="sec-sub">כל משבצת: כל הסשנים שהתחילו באותו יום ושעה בתקופה. משבצת ריקה: פחות מ־4 סשנים.</p></div>
    <div class="seg sm" id="heat-metric"><button aria-pressed="true" data-m="occupancy">תפוסה</button><button aria-pressed="false" data-m="soldOut">נמכרו עד הסוף</button><button aria-pressed="false" data-m="revenue">הכנסה</button></div></div>
    <div class="card heat-wrap"><div class="heat" id="heat-grid"><div></div>${HE_DAYS.map((d, i) => `<div class="hd"><b>${SHORT[i]}</b>${i >= 5 ? 'סופ״ש' : ''}</div>`).join('')}${heatCells('occupancy')}</div>
    <div class="scale"><span>נמוך</span><i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i><i style="background:var(--h5)"></i><span>גבוה</span><span style="margin-inline-start:14px">תפוסה: 40% · 55% · 70% · 85% · 95%</span></div></div></section>`;
}

function levels() {
  const rows = DATA.levels.map(l => {
    const d = l.lyOccupancy === null ? '' : pts(l.occupancy, l.lyOccupancy);
    return `<tr><td><span class="lvcell">${lvChip(l.key)}<small>${lvName(l.key)}</small></span></td>
      <td class="num">${int(l.sessions)}</td>
      <td><div class="occ"><div class="bar"><i style="width:${Math.round(l.occupancy * 100)}%"></i>${l.lyOccupancy === null ? '' : `<u style="inset-inline-start:${Math.round(l.lyOccupancy * 100)}%" title="אשתקד ${pct(l.lyOccupancy)}"></u>`}</div><span class="num">${pct(l.occupancy)}</span></div></td>
      <td class="dlt num ${d !== '' && d <= -10 ? 'bad' : ''}">${d === '' ? '–' : `${d > 0 ? '▲' : d < 0 ? '▼' : '='} ${Math.abs(d)} נק׳`}</td>
      <td class="num">${pct(l.soldOut)}</td>
      <td>${money(l.revenue)} <small class="num" style="color:var(--mist)">(${pct(l.revShare)})</small></td>
      <td><div class="sd" title="חלק מהמקומות ${pct(l.capShare)} · חלק מההזמנות ${pct(l.bookShare)}"><div class="cap" style="width:${Math.round(l.capShare * 300)}%"></div><div class="bk" style="width:${Math.round(l.bookShare * 300)}%"></div></div></td></tr>`;
  }).join('');
  return `<section class="sec" id="levels"><div class="sec-head"><div><h2>מה נמכר</h2><p class="sec-sub">לפי רמה. הקו הכתום על פס התפוסה הוא התפוסה של אשתקד.</p></div></div>
    <div class="card tbl-scroll"><table class="tbl"><thead><tr><th>רמה</th><th>סשנים</th><th>תפוסה</th><th>מול אשתקד</th><th>נמכרו עד הסוף</th><th>הכנסה משוערת</th><th>היצע <span style="color:var(--mist-2)">▬</span> מול ביקוש <span style="color:var(--deep)">▬</span></th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="foot">״היצע מול ביקוש״: הפס האפור הוא החלק של הרמה מכל המקומות בפארק, והכהה הוא החלק שלה מכל ההזמנות. כהה ארוך מאפור: הרמה מבוקשת יותר ממה שמוקצה לה.</p></section>`;
}

function slotRows(list) {
  return list.map((s, i) => `<div class="slot"><span class="rk num">${i + 1}</span><span class="wh">${HE_DAYS[s.weekday]} <span class="ltr num">${s.start}</span></span><span class="lvcell" style="display:flex;gap:6px;align-items:center">${lvChip(s.level)}<small style="color:var(--mist);font-size:12px">${lvName(s.level)}</small></span>
    <div class="occ"><div class="bar"><i style="width:${Math.round(s.occupancy * 100)}%"></i></div><span class="num">${pct(s.occupancy)}</span></div><span class="v">${s.soldOut >= 0.5 ? `מלא ב־${pct(s.soldOut)}` : `${money(s.emptyValue)} ריק`}</span></div>`).join('');
}
function slots() {
  return `<section class="sec" id="slots"><div class="sec-head"><div><h2>הסשנים הכי חזקים והכי חלשים</h2><p class="sec-sub">סשנים קבועים (יום, שעה ורמה) שרצו לפחות 4 פעמים בתקופה.</p></div></div>
    <div class="slots"><div class="card"><h3>הכי מבוקשים<small>מועמדים להוספת סשן</small></h3>${slotRows(DATA.top)}</div>
    <div class="card"><h3>הכי חלשים<small>מועמדים לשינוי רמה, שעה או מבצע</small></h3>${slotRows(DATA.bottom)}</div></div></section>`;
}

function trend() {
  const W = 700, H = 210, L = 36, R = 8, T = 12, B = 34;
  const n = DATA.weeks.length, bw = (W - L - R) / n;
  const y = v => T + (1 - v) * (H - T - B);
  // time runs right to left, like the week view: oldest week on the right
  const x = i => W - R - (i + 1) * bw;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="תפוסה שבועית מול אשתקד">`;
  for (const g of [0, 0.25, 0.5, 0.75, 1]) s += `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" stroke="#D8E3E2"/><text x="${L - 6}" y="${y(g) + 4}" font-size="11" fill="#5F7A83" text-anchor="end">${g * 100}%</text>`;
  DATA.weeks.forEach((w, i) => {
    s += `<rect x="${x(i) + 3}" y="${y(w.occupancy)}" width="${bw - 6}" height="${y(0) - y(w.occupancy)}" rx="3" fill="#0F2B35"><title>שבוע ${d2(w.from)}: ${pct(w.occupancy)} (אשתקד ${pct(w.lyOccupancy)})</title></rect>`;
    if (i % 2 === 0) s += `<text x="${x(i) + bw / 2}" y="${H - 14}" font-size="11" fill="#5F7A83" text-anchor="middle">${d2(w.from)}</text>`;
  });
  const pts2 = DATA.weeks.map((w, i) => `${x(i) + bw / 2},${y(w.lyOccupancy)}`).join(' ');
  s += `<polyline points="${pts2}" fill="none" stroke="#FF5A1F" stroke-width="2"/>`;
  DATA.weeks.forEach((w, i) => { s += `<circle cx="${x(i) + bw / 2}" cy="${y(w.lyOccupancy)}" r="3" fill="#FF5A1F"/>`; });
  s += '</svg>';
  return `<section class="sec" id="trend"><div class="sec-head"><div><h2>מגמה</h2><p class="sec-sub">תפוסה לפי שבוע (בתקופה של 12 חודשים ומעלה: לפי חודש). הזמן זורם מימין לשמאל, כמו בלוח.</p></div>
    <div class="seg sm"><button aria-pressed="true">תפוסה</button><button aria-pressed="false">הכנסה</button></div></div>
    <div class="card trend">${s}<div class="lg"><span><i style="width:14px;height:10px;background:#0F2B35;border-radius:2px;display:inline-block"></i>השנה</span><span><i style="width:14px;height:2px;background:#FF5A1F;display:inline-block"></i>אותו שבוע אשתקד</span><span>ימים סגורים יסומנו בפס מקווקו מתחת לשבוע</span></div></div></section>`;
}

function pace() {
  // Illustrative curve only: the real one needs ~2 weeks of snapshots.
  const W = 460, H = 200, L = 34, R = 10, T = 26, B = 30;
  const leads = [14, 10, 7, 5, 3, 2, 1, 0];
  const xs = i => L + (i / (leads.length - 1)) * (W - L - R);
  const y = v => T + (1 - v) * (H - T - B);
  const curve = (vals, color, dash) => `<polyline points="${vals.map((v, i) => `${xs(i)},${y(v)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" ${dash ? 'stroke-dasharray="5 4"' : ''}/>`;
  let s = `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">`;
  for (const g of [0, 0.5, 1]) s += `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" stroke="#D8E3E2"/><text x="${L - 6}" y="${y(g) + 4}" font-size="11" fill="#5F7A83" text-anchor="end">${g * 100}%</text>`;
  leads.forEach((d, i) => { s += `<text x="${xs(i)}" y="${H - 10}" font-size="11" fill="#5F7A83" text-anchor="middle">${d === 0 ? 'ביום' : d}</text>`; });
  s += curve([0.05, 0.08, 0.14, 0.2, 0.34, 0.46, 0.66, 0.84], '#225A8C') + curve([0.02, 0.04, 0.07, 0.1, 0.18, 0.26, 0.42, 0.61], '#6F9B5C', true);
  s += `<text x="${W - R}" y="${y(0.88)}" font-size="12" fill="#225A8C" text-anchor="end">L5</text><text x="${W - R}" y="${y(0.64)}" font-size="12" fill="#6F9B5C" text-anchor="end">L2</text></svg>`;
  const c = DATA.coverage;
  return `<section class="sec" id="pace"><div class="sec-head"><div><h2>כמה מהר מתמלא</h2><p class="sec-sub">מבוסס על צילומי מצב של הלוח שנאספים מכאן והלאה. הפארק לא שומר מתי הוזמן כל מקום.</p></div></div>
    <div class="pace"><div class="card collect"><span class="k" style="font-size:13px;color:var(--mist)">אוספים נתונים</span><span class="big num">${c.snapshots} צילומי מצב</span>
      <div class="meter"><i style="width:${Math.round(c.snapshots / 300 * 100)}%"></i></div>
      <span style="font-size:13.5px">מאז ${d2(c.snapshotsSince)}. הגרפים יופיעו כשיהיו לפחות 30 סשנים שנצפו מלפחות 7 ימים לפני תחילתם, בערך ב־24.9.</span>
      <ul><li>עקומת מילוי ממוצעת לכל רמה, ולחול מול סוף שבוע</li><li>כמה ימים מראש סשן נמכר עד הסוף (חציון)</li><li>איזה חלק מההזמנות מגיע ב־24 השעות האחרונות</li><li>כמה מקומות מתפנים בביטולים</li></ul></div>
      <div class="card example"><span class="tag">דוגמה להמחשה, לא נתונים אמיתיים</span>${s}<p class="foot" style="margin:2px 4px 0">ציר אופקי: ימים לפני תחילת הסשן. ציר אנכי: כמה מהסשן כבר הוזמן.</p></div></div></section>`;
}

function upcoming() {
  const days = DATA.upDays;
  const bars = days.map(d => `<div class="b"><em class="num">${pct(d.occupancy)}</em><i style="height:${Math.max(2, Math.round(d.occupancy * 100))}%"></i></div>`).join('');
  const lbls = days.map(d => `<span><b>${SHORT[dow(d.date)]}</b>${d2(d.date)}</span>`).join('');
  const rows = DATA.atRisk.slice(0, 7).map(r => `<div class="rrow"><span class="when"><b>${SHORT[dow(r.date)]} <span class="ltr num">${r.start}</span></b><span>בעוד ${r.hours} שעות</span></span>${lvChip(r.level)}<span class="nm">${r.name}</span><span class="fill num">${r.booked}/${r.capacity}<small>${money(r.emptyValue)} פתוח</small></span></div>`).join('');
  return `<section class="sec" id="upcoming"><div class="sec-head"><div><h2>הימים הקרובים</h2><p class="sec-sub">מהלוח שפורסם עכשיו. כשיהיו מספיק צילומי מצב, כל יום יושווה לקצב הרגיל באותו מרחק זמן.</p></div></div>
    <div class="up"><div class="card days"><div class="bars">${bars}</div><div class="lbl">${lbls}</div><p class="foot">כמה מכל יום כבר הוזמן. רוב ההזמנות מגיעות ביומיים האחרונים, לכן ימים רחוקים נראים ריקים.</p></div>
    <div class="card risk"><h3>סשנים בסיכון<small>פחות מ־40% מלא, מתחילים ב־48 השעות הקרובות</small></h3>${rows}<button class="more">ועוד ${DATA.atRisk.length - 7} סשנים</button></div></div></section>`;
}

function ops() {
  const o = DATA.ops;
  return `<section class="sec" id="ops"><div class="sec-head"><div><h2>תפעול</h2><p class="sec-sub">קיבולת שלא הייתה למכירה, ושינויים בלוח.</p></div></div>
    <div class="ops"><div class="card op"><span class="v num">${o.closed.length}</span><span class="k">ימים סגורים</span><p>${o.closed.length ? o.closed.map(c => `${d2(c.date)} ${c.text}`).join(' · ') : 'אין בתקופה. ב־12 החודשים האחרונים: 19, בעיקר תחזוקה, תקלה ב־17–20.3 ו־28.2–4.3 בהנחיית פיקוד העורף.'}</p></div>
    <div class="card op"><span class="v num">${o.blocked}</span><span class="k">סשנים חסומים לאירועים</span><p>${o.blockedNames.slice(0, 3).join(' · ')}</p></div>
    <div class="card op"><span class="v num">${o.cancelled}</span><span class="k">סשנים שבוטלו</span><p>קיבולת 0 בלוח. הוסרו מהלוח לפני שהתקיימו: נספר מכאן והלאה.</p></div>
    <div class="card op"><span class="v num">${o.overbooked}</span><span class="k">צדדים עם הזמנת יתר</span><p>${o.overbookedPeople} גולשים מעבר לקיבולת, בדרך כלל אחרי שהקיבולת הוקטנה.</p></div></div>
    <p class="coverage">היסטוריה מ־${d2(DATA.coverage.first)}.${DATA.coverage.first.slice(0, 4)} · ${int(DATA.coverage.sessions)} סשנים · ${DATA.coverage.snapshots} צילומי מצב מאז ${d2(DATA.coverage.snapshotsSince)} · מתעדכן בכל ריענון</p></section>`;
}

$('#analysis').innerHTML = kpis() + insights() + heat() + levels() + slots() + trend() + pace() + upcoming() + ops();
document.querySelector('#heat-metric').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#heat-metric button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  const grid = $('#heat-grid');
  grid.innerHTML = '<div></div>' + HE_DAYS.map((d, i) => `<div class="hd"><b>${SHORT[i]}</b>${i >= 5 ? 'סופ״ש' : ''}</div>`).join('') + heatCells(b.dataset.m);
});
</script>
</body>
</html>

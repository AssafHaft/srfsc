<head>

<title>לוח סשנים – SRF Park TLV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --foam: #F1F6F5;
  --deck: #FFFFFF;
  --deep: #0F2B35;
  --deep-2: #244652;
  --mist: #5F7A83;
  --mist-2: #9DB4BA;
  --line: #D8E3E2;
  --rescue: #FF5A1F;
  --l0: #E2B860; --l1: #91C36B; --l2: #6F9B5C; --l3: #487037;
  --l4: #81ABCA; --l5: #225A8C; --l6: #8A71B2;
  --display: "Secular One", "IBM Plex Sans Hebrew", system-ui, sans-serif;
  --text: "IBM Plex Sans Hebrew", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--foam); }
body { margin: 0; font-family: var(--text); color: var(--deep); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--deep); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 32px 24px 56px; }

/* header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 24px; }
.brand h1 { font-family: var(--display); font-weight: 400; font-size: 36px; line-height: 1; margin: 0; }
.brand p { margin: 8px 0 0; color: var(--mist); font-size: 14px; }
.fresh { display: flex; align-items: center; gap: 14px; }
.fresh-text { text-align: end; font-size: 13px; color: var(--mist); line-height: 1.45; }
.fresh-text strong { display: block; color: var(--deep); font-weight: 500; font-size: 14px; }
.btn-refresh { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border: 1.5px solid var(--deep); border-radius: 999px; font-weight: 500; font-size: 14px; transition: background-color .15s, color .15s; }
.btn-refresh:hover { background: var(--deep); color: var(--foam); }
.btn-refresh svg { width: 16px; height: 16px; }
.btn-refresh.is-busy svg { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(-360deg); } }

/* controls */
.controls { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; margin-bottom: 16px; }
.seg { display: inline-flex; background: var(--deck); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { padding: 6px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--mist); }
.seg button[aria-pressed="true"] { background: var(--deep); color: var(--foam); }
.levels { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.levels-label { font-size: 13px; color: var(--mist); margin-inline-end: 6px; }
.lv-toggle { padding: 3px; border-radius: 8px; border: 1.5px solid transparent; }
.lv-toggle[aria-pressed="true"] { border-color: var(--deep); }

/* level chip + spots */
.chip { display: inline-grid; place-items: center; min-width: 30px; height: 20px; padding: 0 5px; border-radius: 5px; font-size: 12px; font-weight: 600; line-height: 1; color: #fff; direction: ltr; flex: none; }
.chip.lv0, .chip.lv1, .chip.lv2, .chip.lv4 { color: var(--deep); }
.lv0 { background: var(--l0); } .lv1 { background: var(--l1); } .lv2 { background: var(--l2); } .lv3 { background: var(--l3); }
.lv4 { background: var(--l4); } .lv5 { background: var(--l5); } .lv6 { background: var(--l6); }
.spot { min-width: 20px; text-align: center; font-size: 13px; font-weight: 600; line-height: 20px; }
.spot.few { background: var(--rescue); color: var(--deep); border-radius: 4px; padding: 0 5px; }
.spot.full { font-size: 12px; font-weight: 400; color: var(--mist); }
.spot.none { color: var(--mist-2); font-weight: 400; }
.pier { display: inline-flex; align-items: center; }
.pier-line { width: 1px; height: 14px; background: var(--line); margin: 0 5px; }
.sess { position: relative; z-index: 2; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.past { opacity: .38; }
.off { opacity: .16; }

/* week */
.week-scroll { overflow-x: auto; }
.week { display: grid; grid-template-columns: 40px repeat(7, minmax(118px, 1fr)); min-width: 880px; }
.corner { position: sticky; right: 0; background: var(--foam); z-index: 3; }
.dh { display: flex; flex-direction: column; align-items: flex-start; padding: 10px 12px; border-radius: 12px 12px 0 0; }
.dh:hover .dd { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.dh .dn { font-size: 13px; color: var(--mist); }
.dh .dd { font-family: var(--display); font-size: 26px; line-height: 1.1; }
.dh .hrs { font-size: 12px; color: var(--mist); }
.hr { position: sticky; right: 0; z-index: 3; background: var(--foam); padding-top: 7px; font-size: 12px; color: var(--mist); border-top: 1px solid var(--line); }
.cell { position: relative; border-top: 1px solid var(--line); padding: 6px 12px; min-height: 38px; display: flex; flex-direction: column; justify-content: flex-start; gap: 4px; }
.past { filter: grayscale(1); }
.is-today { background: var(--deep); color: var(--foam); }
.cell.is-today { border-top-color: var(--deep-2); }
.dh.is-today .dn { color: var(--foam); font-weight: 600; }
.dh.is-today .hrs { color: var(--mist-2); }
.cell.is-today.last { border-radius: 0 0 12px 12px; }
.is-today .spot.full { color: var(--mist-2); }
.is-today .pier-line { background: var(--deep-2); }
.now { position: absolute; inset-inline: 0; height: 0; border-top: 2px solid var(--foam); pointer-events: none; z-index: 1; }
.now::before { content: ""; position: absolute; inset-inline-start: -1px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--foam); }
.now span { position: absolute; inset-inline-end: 4px; top: -9px; font-size: 11px; font-weight: 600; line-height: 16px; background: var(--foam); color: var(--deep); padding: 0 6px; border-radius: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 18px; font-size: 13px; color: var(--mist); }
.legend > span { display: inline-flex; align-items: center; gap: 8px; }

/* month */
.month-title { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 4px 0 12px; }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.mh { font-size: 13px; color: var(--mist); padding: 0 10px 2px; }
.mh .s { display: none; }
.mc { display: flex; flex-direction: column; align-items: stretch; gap: 5px; min-height: 112px; padding: 9px 10px 10px; border-radius: 12px; background: var(--deck); border: 1px solid var(--line); }
button.mc:hover { border-color: var(--deep); }
.mc-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.mc .dd { font-family: var(--display); font-size: 22px; line-height: 1; }
.mc .tag { font-size: 12px; font-weight: 600; }
.mc .meta { font-size: 12px; color: var(--mist); }
.mc .free { font-size: 13px; font-weight: 500; margin-top: auto; }
.strip { display: flex; gap: 2px; height: 8px; }
.strip i { flex: 1; border-radius: 2px; }
.mc.is-past { background: transparent; border-color: transparent; color: var(--mist-2); }
.mc.is-empty, .mc.is-closed { background: transparent; }
.mc.is-unpub { background: transparent; border: 1px dashed var(--mist-2); }
.mc .closed { font-weight: 600; font-size: 14px; }
.mc.is-today { background: var(--deep); border-color: var(--deep); color: var(--foam); }
.mc.is-today .meta { color: var(--mist-2); }

/* day */
.day-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 4px 0 16px; }
.day-head .kicker { font-size: 14px; font-weight: 600; }
.day-head .dd { font-family: var(--display); font-size: 32px; line-height: 1.05; }
.day-head .sub { font-size: 14px; color: var(--mist); margin-top: 4px; }
.nav { display: flex; gap: 8px; }
.nav button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--deck); display: inline-grid; place-items: center; }
.nav button:hover { border-color: var(--deep); }
.nav svg { width: 18px; height: 18px; }
.list { background: var(--deck); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { display: grid; grid-template-columns: 150px 36px minmax(0, 1fr) minmax(250px, 320px); gap: 14px; align-items: center; padding: 11px 18px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row.head { padding-block: 9px; font-size: 12px; color: var(--mist); }
.row .time { font-size: 14px; color: var(--mist); }
.row .name { font-size: 15px; font-weight: 500; line-height: 1.35; }
.row .name small { display: block; font-size: 12px; font-weight: 400; color: var(--mist); }
.row.is-now { background: #E6F0EF; }
.now-tag { margin-inline-start: 8px; font-size: 11px; font-weight: 600; background: var(--deep); color: var(--foam); padding: 1px 6px; border-radius: 4px; }
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.sides.bay { grid-template-columns: 1fr; }
.side { display: flex; align-items: center; gap: 8px; }
.side-l { display: none; font-size: 12px; color: var(--mist); min-width: 34px; }
.bar { flex: 1; height: 6px; border-radius: 3px; background: #E4ECEB; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.empty { padding: 28px; text-align: center; color: var(--mist); background: var(--deck); border: 1px solid var(--line); border-radius: 14px; }

@media (max-width: 720px) {
  .wrap { padding: 20px 14px 44px; }
  .brand h1 { font-size: 30px; }
  .fresh { width: 100%; justify-content: space-between; }
  .fresh-text { text-align: start; }
  .row { grid-template-columns: 36px minmax(0, 1fr); gap: 6px 10px; padding: 12px 14px; }
  .row .time { grid-column: 1 / -1; font-size: 13px; }
  .row .sides { grid-column: 1 / -1; }
  .row.head { display: none; }
  .side-l { display: inline; }
  .mh .l { display: none; } .mh .s { display: inline; }
  .mh { padding: 0 4px 2px; }
  .month { gap: 4px; }
  .mc { min-height: 76px; padding: 6px 6px 7px; border-radius: 9px; }
  .mc .dd { font-size: 18px; }
  .mc .meta, .mc .tag { display: none; }
  .mc.is-closed .meta, .mc.is-unpub .meta, .mc.is-empty .meta { display: block; font-size: 11px; }
  .mc .free { font-size: 11px; }
  .day-head .dd { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

1,19,21,""],["17:00","18:00",5,6,null,15,15,""],["17:30","19:00",0,15,11,null,12,"B"],["17:30","19:00",0,13,12,null,12,"B"],["18:00","19:00",1,3,20,19,20,""],["19:00","20:00",5,1,13,15,15,""],["20:00","21:00",4,4,18,18,18,""],["21:00","22:00",6,17,15,13,15,""]]}};</script>
<script>
const D = window.D;
const T = '2026-09-10', NOW = '16:20', LAST = '2026-09-24';
const HEL = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
const HES = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
const hashView = location.hash.slice(1);
const state = { view: ['day', 'week', 'month'].includes(hashView) ? hashView : window.innerWidth < 720 ? 'day' : 'week', day: T, levels: new Set() };
const $ = s => document.querySelector(s);
const add = (iso, n) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dow = iso => new Date(iso + 'T12:00:00Z').getUTCDay();
const dd = iso => `${+iso.slice(8)}.${+iso.slice(5, 7)}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const range = (a, b) => `<span class="ltr num">${a}–${b}</span>`;
const chip = (lv, bay) => `<span class="chip lv${lv}">${bay || lv === 0 ? 'Bay' : 'L' + lv}</span>`;
const spot = v => v == null ? '<span class="spot none">–</span>'
  : v === 0 ? '<span class="spot full">מלא</span>'
  : `<span class="spot num${v <= 3 ? ' few' : ''}">${v}</span>`;
const pier = (r, l) => `<span class="pier">${spot(r)}<i class="pier-line"></i>${spot(l)}</span>`;
const isPast = (s, d) => d === T && s[1] <= NOW;
const isNow = (s, d) => d === T && s[0] <= NOW && NOW < s[1];
const isOff = s => state.levels.size > 0 && !state.levels.has(s[2]);
const cls = (...c) => c.filter(Boolean).join(' ');

function label(name) {
  if (name.includes('Bay')) return { title: 'שיעור מתחילים ב־Bay', note: name.split(' - ').pop() };
  return {
    title: name.replace(/\s*-\s*כולל.*$/, '').replace(/^L\d\s*[-–]?\s*/, '').trim(),
    note: name.includes('כולל גלשן סופט') ? 'כולל גלשן סופט' : ''
  };
}

function sess(s, d) {
  return `<div class="${cls('sess', isPast(s, d) && 'past', isOff(s) && 'off')}" title="${esc(`${s[0]}–${s[1]}  ${D.names[s[3]]}`)}">${chip(s[2], s[7])}${s[7] ? spot(s[4]) : pier(s[4], s[5])}</div>`;
}

function legend() {
  return `<div class="legend">
    <span><span class="sess">${chip(5)}${pier(8, 6)}</span>מקומות פנויים בריף ימין ובריף שמאל</span>
    <span>${spot(2)}נותרו מקומות אחרונים</span>
    <span><span class="spot full">מלא</span>אין מקומות פנויים</span>
  </div>`;
}

function week() {
  const days = Array.from({ length: 7 }, (_, i) => add(T, i));
  let h = '<div class="week-scroll"><div class="week"><div class="corner"></div>';
  for (const d of days) {
    const s = D.summary[d], t = d === T;
    const hrs = D.closed[d] ? 'סגור' : s ? range(s[0].slice(0, 2), s[1].slice(0, 2)) : 'אין סשנים';
    h += `<button class="${cls('dh', t && 'is-today')}" data-day="${d}"><span class="dn">${t ? 'היום' : HEL[dow(d)]}</span><span class="dd num">${dd(d)}</span><span class="hrs">${hrs}</span></button>`;
  }
  for (let hr = 6; hr <= 22; hr++) {
    const hh = String(hr).padStart(2, '0');
    h += `<div class="hr num">${hh}</div>`;
    for (const d of days) {
      const t = d === T;
      let inner = (D.detail[d] || []).filter(s => s[0].startsWith(hh)).map(s => sess(s, d)).join('');
      if (t && NOW.startsWith(hh)) inner += `<div class="now" style="top:${Math.round(+NOW.slice(3) / 60 * 100)}%"><span>עכשיו</span></div>`;
      h += `<div class="${cls('cell', t && 'is-today', t && hr === 22 && 'last')}">${inner}</div>`;
    }
  }
  return h + '</div></div>' + legend();
}

const HEM = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
function month() {
  // This week through the week holding the last published day, plus one "not published yet" week.
  const start = add(T, -dow(T));
  const weeks = Math.floor((Date.parse(LAST) - Date.parse(start)) / 864e5 / 7) + 2;
  const end = add(start, weeks * 7 - 1);
  const m1 = +start.slice(5, 7), m2 = +end.slice(5, 7);
  const title = m1 === m2 ? `${HEM[m1 - 1]} ${end.slice(0, 4)}` : `${HEM[m1 - 1]}–${HEM[m2 - 1]} ${end.slice(0, 4)}`;
  let h = `<h2 class="month-title">${title}</h2><div class="month">`;
  h += HEL.map((n, i) => `<div class="mh"><span class="l">${n}</span><span class="s">${HES[i]}</span></div>`).join('');
  for (let i = 0; i < weeks * 7; i++) {
    const d = add(start, i), s = D.summary[d], closed = D.closed[d], t = d === T;
    const gone = d < T;
    let kind = '', body = '';
    if (gone) kind = 'is-past';
    else if (closed) { kind = 'is-closed'; body = `<span class="closed">סגור</span><span class="meta">${closed}</span>`; }
    else if (d > LAST) { kind = 'is-unpub'; body = '<span class="meta">טרם פורסם</span>'; }
    else if (s) body = `<span class="meta">${range(s[0].slice(0, 2), s[1].slice(0, 2))}</span><span class="strip">${[...s[5]].map(x => `<i class="lv${x}"></i>`).join('')}</span><span class="free num">${s[3]} פנויים</span>`;
    else { kind = 'is-empty'; body = '<span class="meta">אין סשנים</span>'; }
    const top = `<span class="mc-top"><span class="dd num">${d.endsWith('-01') ? dd(d) : +d.slice(8)}</span>${t ? '<span class="tag">היום</span>' : ''}</span>`;
    h += gone || !s
      ? `<div class="${cls('mc', kind, t && 'is-today')}">${top}${body}</div>`
      : `<button class="${cls('mc', kind, t && 'is-today')}" data-day="${d}">${top}${body}</button>`;
  }
  return h + '</div>';
}

function day(d) {
  const s = D.summary[d], all = D.detail[d], closed = D.closed[d], t = d === T;
  // Today: sessions that already ended sit behind a toggle, so the list opens at "now".
  const pastCount = all ? all.filter(x => isPast(x, d)).length : 0;
  const list = all && (state.showPast ? all : all.filter(x => !isPast(x, d)));
  const pastToggle = pastCount ? `<button onclick="state.showPast = !state.showPast; render()" style="display:block;margin-top:6px;font-size:13px;font-weight:500;color:var(--deep);text-decoration:underline;text-underline-offset:3px">${state.showPast ? 'הסתרת' : 'הצגת'} ${pastCount} סשנים שכבר הסתיימו</button>` : '';
  const sub = (closed ? `סגור: ${closed}` : s ? `פתוח ${range(s[0], s[1])}, ${s[3]} מקומות פנויים` : d > LAST ? 'הלוח עוד לא פורסם' : 'אין סשנים ביום הזה') + pastToggle;
  let h = `<div class="day-head"><div>${t ? '<div class="kicker">היום</div>' : ''}<div class="dd">${HEL[dow(d)]} <span class="num">${dd(d)}</span></div><div class="sub">${sub}</div></div>
    <div class="nav"><button data-step="-1" aria-label="היום הקודם"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button><button data-step="1" aria-label="היום הבא"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button></div></div>`;
  if (!list) return h + `<p class="empty">${s ? 'בהדגמה יש פירוט שעתי עד 16.9. באתר עצמו יופיע כאן כל היום.' : closed ? 'הפארק סגור ביום הזה.' : 'אין סשנים ביום הזה.'}</p>`;
  h += '<div class="list"><div class="row head"><span></span><span></span><span></span><span class="sides"><span>ריף ימין</span><span>ריף שמאל</span></span></div>';
  for (const x of list) {
    const lb = label(D.names[x[3]]);
    const side = (v, name) => v == null
      ? `<span class="side"><span class="side-l">${name}</span><span class="spot none">–</span></span>`
      : `<span class="side"><span class="side-l">${name}</span><span class="bar"><i class="lv${x[2]}" style="width:${Math.max(0, Math.min(100, Math.round((x[6] - v) / x[6] * 100)))}%"></i></span>${spot(v)}</span>`;
    const sides = x[7] ? `<span class="sides bay">${side(x[4], 'Bay')}</span>` : `<span class="sides">${side(x[4], 'ימין')}${side(x[5], 'שמאל')}</span>`;
    h += `<div class="${cls('row', isPast(x, d) && 'past', isNow(x, d) && 'is-now', isOff(x) && 'off')}"><span class="time">${range(x[0], x[1])}${isNow(x, d) ? '<span class="now-tag">עכשיו</span>' : ''}</span>${chip(x[2], x[7])}<span class="name">${esc(lb.title)}${lb.note ? `<small>${esc(lb.note)}</small>` : ''}</span>${sides}</div>`;
  }
  return h + '</div>';
}

function render() {
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === state.view)));
  $('#view').innerHTML = state.view === 'week' ? week() : state.view === 'month' ? month() : day(state.day);
}

$('#levels').innerHTML = '<span class="levels-label">סינון לפי רמה</span>' +
  [0, 1, 2, 3, 4, 5, 6].map(l => `<button class="lv-toggle" data-level="${l}" aria-pressed="false" aria-label="${l ? 'רמה ' + l : 'Bay'}">${chip(l)}</button>`).join('');

document.addEventListener('click', e => {
  const el = e.target.closest('[data-view],[data-day],[data-level],[data-step]');
  if (!el) return;
  if (el.dataset.view) state.view = el.dataset.view;
  else if (el.dataset.day) { state.day = el.dataset.day; state.view = 'day'; }
  else if (el.dataset.level) {
    const n = +el.dataset.level;
    state.levels.has(n) ? state.levels.delete(n) : state.levels.add(n);
    el.setAttribute('aria-pressed', String(state.levels.has(n)));
  } else if (el.dataset.step) {
    const n = add(state.day, +el.dataset.step);
    if (n < T || n > LAST) return;
    state.day = n;
  }
  render();
});

const btn = $('#refresh');
btn.addEventListener('click', () => {
  if (btn.classList.contains('is-busy')) return;
  btn.classList.add('is-busy');
  btn.lastElementChild.textContent = 'מעדכן…';
  $('#fresh-main').textContent = 'העדכון רץ עכשיו ב־GitHub';
  $('#fresh-sub').textContent = 'זה לוקח בערך דקה';
  setTimeout(() => {
    btn.classList.remove('is-busy');
    btn.lastElementChild.textContent = 'עדכון עכשיו';
    $('#fresh-main').textContent = 'עודכן עכשיו';
    $('#fresh-sub').textContent = 'הלוח פורסם עד יום חמישי, 24.9';
  }, 3500);
});

render();
</script>
